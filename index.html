<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>To-do Học Tập</title>
<style>
:root {
  --bg:#f0f4ff; --surface:#fff; --surface2:#f7f9ff; --border:#e2e8f8;
  --text:#1a1f36; --muted:#6b7499; --accent:#4f6ef7; --accent2:#7c3aed;
  --soft:#eef1ff; --done:#a0aec0; --danger:#f56565; --ok:#48bb78;
  --sh:0 4px 24px rgba(79,110,247,.10); --r:16px; --tr:.22s ease;
}
[data-theme=dark]{
  --bg:#0f1120; --surface:#181c2e; --surface2:#1e2340; --border:#2a3060;
  --text:#e8ecff; --muted:#7b87b8; --accent:#6680ff; --accent2:#a78bfa;
  --soft:#1e2340; --done:#4a5270; --danger:#fc8181; --ok:#68d391;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;transition:background var(--tr),color var(--tr)}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 0}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
header h1{font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#clock{font-size:.78rem;color:var(--muted);margin-top:2px}
#btnDark{background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:50px;padding:7px 16px;font-size:.82rem;cursor:pointer;transition:all var(--tr)}
#btnDark:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--muted);font-size:.88rem;font-weight:500;cursor:pointer;transition:all var(--tr)}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.tab:not(.on):hover{border-color:var(--accent);color:var(--accent)}

.panel{display:none}.panel.on{display:block}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:4px}
.grp.grow{flex:1;min-width:150px}
.grp label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=date],input[type=time],select{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;
  padding:9px 13px;font-size:.9rem;color:var(--text);outline:none;width:100%;
  transition:border-color var(--tr),box-shadow var(--tr);
}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.btn-add{padding:9px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;height:40px;white-space:nowrap;transition:transform var(--tr)}
.btn-add:hover{transform:translateY(-2px)}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--soft);border:1.5px solid var(--border);border-radius:50px;padding:5px 15px;font-size:.8rem;font-weight:700;color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{padding:5px 13px;border:1.5px solid var(--border);border-radius:50px;background:var(--surface);color:var(--muted);font-size:.78rem;cursor:pointer;transition:all var(--tr)}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.fbtn:not(.on):hover{border-color:var(--accent);color:var(--accent)}

#taskList{list-style:none}
.ti{display:flex;align-items:center;gap:11px;padding:13px 15px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;margin-bottom:9px;transition:all var(--tr)}
.ti:hover{border-color:var(--accent);transform:translateX(3px);box-shadow:0 2px 12px rgba(79,110,247,.10)}
.ti.done{opacity:.55}
.ti.done .ttxt{text-decoration:line-through;color:var(--done)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all var(--tr)}
.ti.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:hover{border-color:var(--ok)}
.tbody{flex:1;min-width:0}
.ttxt{font-size:.9rem;font-weight:500;word-break:break-word}
.tmeta{font-size:.73rem;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pbadge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:50px;text-transform:uppercase}
.ph{background:rgba(245,101,101,.12);color:var(--danger)}
.pm{background:rgba(237,137,54,.12);color:#ed8936}
.pl{background:rgba(72,187,120,.12);color:var(--ok)}
.del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:4px 6px;border-radius:8px;transition:all var(--tr);flex-shrink:0}
.del:hover{background:rgba(245,101,101,.12);color:var(--danger)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.88rem}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav button{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:1rem;transition:all var(--tr);display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-nav h2{font-size:.95rem;font-weight:700;min-width:120px;text-align:center}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dname{text-align:center;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;padding:5px 0}
.cday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:.82rem;font-weight:500;position:relative;border:1.5px solid transparent;transition:all var(--tr)}
.cday:hover:not(.empty){background:var(--soft);border-color:var(--accent)}
.cday.today{background:var(--accent);color:#fff;font-weight:700}
.cday.sel:not(.today){border-color:var(--accent);background:var(--soft);color:var(--accent)}
.cday.has::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent2)}
.cday.today.has::after{background:rgba(255,255,255,.8)}
.cday.empty{cursor:default}

.dlabel{font-size:.88rem;font-weight:700;color:var(--muted);margin-bottom:13px}
.dlabel span{color:var(--accent)}
.tline{position:relative;padding-left:50px}
.tline::before{content:'';position:absolute;left:36px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),var(--accent2),transparent);opacity:.3;border-radius:2px}
.titem{position:relative;margin-bottom:13px}
.ttime{position:absolute;left:-50px;top:11px;font-size:.7rem;font-weight:700;color:var(--accent);width:42px;text-align:right}
.tdot{position:absolute;left:-15px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tdot.done{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.tcard{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;cursor:pointer;transition:all var(--tr)}
.tcard:hover{border-color:var(--accent);transform:translateX(3px)}
.tcard.done{opacity:.5}
.tcard.done .tc-t{text-decoration:line-through;color:var(--done)}
.tc-t{font-size:.86rem;font-weight:600}
.tc-m{font-size:.73rem;color:var(--muted);margin-top:3px;display:flex;gap:7px;align-items:center}
.noday{text-align:center;padding:28px;color:var(--muted);font-size:.84rem}

@media(max-width:580px){
  .row{flex-direction:column}
  .btn-add{width:100%;height:44px}
  .cday{font-size:.7rem}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>&#128218; To-do Học Tập</h1>
      <div id="clock">--</div>
    </div>
    <button id="btnDark">&#127769; Dark Mode</button>
  </header>

  <div class="tabs">
    <button class="tab on" id="t-list">&#128203; Danh sách</button>
    <button class="tab" id="t-cal">&#128197; Lịch &amp; Timeline</button>
  </div>

  <div class="panel on" id="p-list">
    <div class="card">
      <div class="row">
        <div class="grp grow">
          <label>Công việc</label>
          <input type="text" id="iText" placeholder="Nhập công việc học tập..."/>
        </div>
        <div class="grp">
          <label>Ngày</label>
          <input type="date" id="iDate"/>
        </div>
        <div class="grp">
          <label>Giờ</label>
          <input type="time" id="iTime"/>
        </div>
        <div class="grp">
          <label>Ưu tiên</label>
          <select id="iPri">
            <option value="high">&#128308; Cao</option>
            <option value="mid" selected>&#128993; Vừa</option>
            <option value="low">&#128994; Thấp</option>
          </select>
        </div>
        <button class="btn-add" id="btnAdd">+ Thêm</button>
      </div>
    </div>

    <div class="stats">
      <div class="pill">&#128204; Còn lại: <span id="sRem">0</span></div>
      <div class="pill">&#9989; Xong: <span id="sDone">0</span></div>
      <div class="pill">&#128230; Tổng: <span id="sAll">0</span></div>
    </div>

    <div class="filters">
      <button class="fbtn on" data-f="all">Tất cả</button>
      <button class="fbtn" data-f="pending">Chưa xong</button>
      <button class="fbtn" data-f="done">Đã xong</button>
      <button class="fbtn" data-f="today">Hôm nay</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <div class="panel" id="p-cal">
    <div class="card">
      <div class="cal-header">
        <div class="cal-nav">
          <button id="btnPrev">&#8249;</button>
          <h2 id="calLabel">--</h2>
          <button id="btnNext">&#8250;</button>
        </div>
        <button class="fbtn on" id="btnToday">Hôm nay</button>
      </div>
      <div class="grid7" id="calGrid"></div>
    </div>
    <div class="card">
      <div class="dlabel">Lịch ngày <span id="dayLabel">--</span></div>
      <div id="tlBox"></div>
    </div>
  </div>

</div>

<script>
(function() {
  // STATE
  var tasks = [];
  var curFilter = 'all';
  var calY, calM, selDate;

  function loadTasks() {
    try { tasks = JSON.parse(localStorage.getItem('tdht_v3') || '[]'); }
    catch(e) { tasks = []; }
  }
  function saveTasks() {
    try { localStorage.setItem('tdht_v3', JSON.stringify(tasks)); } catch(e) {}
  }
  loadTasks();

  // HELPERS
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate());
  }
  function p2(n) { return n < 10 ? '0'+n : ''+n; }
  function fmtDate(s) {
    if (!s) return '';
    var x = s.split('-');
    return x[2]+'/'+x[1]+'/'+x[0];
  }
  function priLabel(p) {
    if (p==='high') return 'Cao';
    if (p==='mid')  return 'Vừa';
    return 'Thấp';
  }
  function priIcon(p) {
    if (p==='high') return '&#128308; ';
    if (p==='mid')  return '&#128993; ';
    return '&#128994; ';
  }
  function priCls(p) {
    if (p==='high') return 'ph';
    if (p==='mid')  return 'pm';
    return 'pl';
  }
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // CLOCK
  function tick() {
    var d = new Date();
    var days = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
    var el = document.getElementById('clock');
    if (el) el.textContent = days[d.getDay()] + ', ' +
      d.toLocaleDateString('vi-VN',{year:'numeric',month:'long',day:'numeric'}) +
      ' — ' + d.toLocaleTimeString('vi-VN');
  }
  tick();
  setInterval(tick, 1000);

  // DARK MODE
  var dark = localStorage.getItem('tdht_dark') === '1';
  function applyDark() {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
    var b = document.getElementById('btnDark');
    if (b) b.textContent = dark ? '☀️ Light Mode' : '🌙 Dark Mode';
    localStorage.setItem('tdht_dark', dark ? '1' : '0');
  }
  applyDark();
  document.getElementById('btnDark').addEventListener('click', function() {
    dark = !dark; applyDark();
  });

  // TABS
  document.getElementById('t-list').addEventListener('click', function() {
    document.getElementById('t-list').classList.add('on');
    document.getElementById('t-cal').classList.remove('on');
    document.getElementById('p-list').classList.add('on');
    document.getElementById('p-cal').classList.remove('on');
  });
  document.getElementById('t-cal').addEventListener('click', function() {
    document.getElementById('t-cal').classList.add('on');
    document.getElementById('t-list').classList.remove('on');
    document.getElementById('p-cal').classList.add('on');
    document.getElementById('p-list').classList.remove('on');
    renderCal();
  });

  // ADD TASK
  document.getElementById('btnAdd').addEventListener('click', addTask);
  document.getElementById('iText').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addTask();
  });

  function addTask() {
    var text = document.getElementById('iText').value.trim();
    var date = document.getElementById('iDate').value;
    var time = document.getElementById('iTime').value;
    var pri  = document.getElementById('iPri').value;

    if (!text) { alert('Vui lòng nhập tên công việc!'); document.getElementById('iText').focus(); return; }
    if (!date) { alert('Vui lòng chọn ngày!'); document.getElementById('iDate').focus(); return; }
    if (!time) { alert('Vui lòng chọn giờ!'); document.getElementById('iTime').focus(); return; }

    tasks.push({ id: Date.now(), text: text, date: date, time: time, pri: pri, done: false });
    tasks.sort(function(a, b) {
      var ka = a.date + 'T' + a.time;
      var kb = b.date + 'T' + b.time;
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    saveTasks();
    renderList();
    document.getElementById('iText').value = '';
    document.getElementById('iDate').value = todayStr();
    document.getElementById('iTime').value = '';
    document.getElementById('iText').focus();
  }

  // TOGGLE & DELETE (exposed to global for inline onclick)
  window._toggle = function(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) { tasks[i].done = !tasks[i].done; break; }
    }
    saveTasks();
    renderList();
    renderTL();
  };
  window._delete = function(id) {
    if (!confirm('Xoá công việc này?')) return;
    tasks = tasks.filter(function(t) { return t.id !== id; });
    saveTasks();
    renderList();
    renderTL();
  };

  // FILTER BUTTONS
  var fbtns = document.querySelectorAll('.fbtn[data-f]');
  fbtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      fbtns.forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      curFilter = btn.getAttribute('data-f');
      renderList();
    });
  });

  function getFiltered() {
    var t = todayStr();
    if (curFilter === 'pending') return tasks.filter(function(x) { return !x.done; });
    if (curFilter === 'done')    return tasks.filter(function(x) { return x.done; });
    if (curFilter === 'today')   return tasks.filter(function(x) { return x.date === t; });
    return tasks.slice();
  }

  // RENDER TASK LIST
  function renderList() {
    var list = document.getElementById('taskList');
    var arr  = getFiltered();

    document.getElementById('sAll').textContent  = tasks.length;
    document.getElementById('sDone').textContent = tasks.filter(function(t) { return t.done; }).length;
    document.getElementById('sRem').textContent  = tasks.filter(function(t) { return !t.done; }).length;

    if (arr.length === 0) {
      list.innerHTML = '<li class="empty">📭 Không có công việc nào' + (curFilter !== 'all' ? ' trong mục này' : '') + '</li>';
      return;
    }

    var html = '';
    for (var i = 0; i < arr.length; i++) {
      var t = arr[i];
      html += '<li class="ti' + (t.done ? ' done' : '') + '">';
      html += '<button class="chk" onclick="window._toggle(' + t.id + ')">✓</button>';
      html += '<div class="tbody">';
      html += '<div class="ttxt">' + esc(t.text) + '</div>';
      html += '<div class="tmeta">';
      html += '<span>📅 ' + fmtDate(t.date) + '</span>';
      if (t.time) html += '<span>⏰ ' + t.time + '</span>';
      html += '<span class="pbadge ' + priCls(t.pri) + '">' + priIcon(t.pri) + priLabel(t.pri) + '</span>';
      html += '</div></div>';
      html += '<button class="del" onclick="window._delete(' + t.id + ')">🗑</button>';
      html += '</li>';
    }
    list.innerHTML = html;
  }

  // CALENDAR
  var nowD = new Date();
  calY = nowD.getFullYear();
  calM = nowD.getMonth();
  selDate = todayStr();

  document.getElementById('btnPrev').addEventListener('click', function() {
    calM--; if (calM < 0) { calM = 11; calY--; } renderCal();
  });
  document.getElementById('btnNext').addEventListener('click', function() {
    calM++; if (calM > 11) { calM = 0; calY++; } renderCal();
  });
  document.getElementById('btnToday').addEventListener('click', function() {
    var n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); selDate = todayStr(); renderCal();
  });

  window._pickDay = function(ds) { selDate = ds; renderCal(); };

  function renderCal() {
    var months = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6',
                  'Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
    document.getElementById('calLabel').textContent = months[calM] + ' ' + calY;

    var grid = document.getElementById('calGrid');
    var dnames = ['CN','T2','T3','T4','T5','T6','T7'];
    var html = '';
    for (var i = 0; i < dnames.length; i++) {
      html += '<div class="dname">' + dnames[i] + '</div>';
    }

    var first  = new Date(calY, calM, 1).getDay();
    var total  = new Date(calY, calM + 1, 0).getDate();
    var today  = todayStr();
    var tdates = {};
    for (var j = 0; j < tasks.length; j++) tdates[tasks[j].date] = true;

    for (var e = 0; e < first; e++) html += '<div class="cday empty"></div>';

    for (var d = 1; d <= total; d++) {
      var ds = calY + '-' + p2(calM+1) + '-' + p2(d);
      var cls = 'cday';
      if (ds === today)             cls += ' today';
      else if (ds === selDate)      cls += ' sel';
      if (tdates[ds])               cls += ' has';
      html += '<div class="' + cls + '" onclick="window._pickDay(\'' + ds + '\')">' + d + '</div>';
    }

    grid.innerHTML = html;
    renderTL();
  }

  function renderTL() {
    var lbl = document.getElementById('dayLabel');
    var box = document.getElementById('tlBox');
    if (!lbl || !box) return;

    if (!selDate) {
      lbl.textContent = '--';
      box.innerHTML = '<div class="noday">Chọn ngày để xem</div>';
      return;
    }

    var p = selDate.split('-');
    lbl.textContent = p[2] + '/' + p[1] + '/' + p[0];

    var arr = tasks.filter(function(t) { return t.date === selDate; });
    arr.sort(function(a, b) { return a.time < b.time ? -1 : 1; });

    if (arr.length === 0) {
      box.innerHTML = '<div class="noday">🎉 Không có công việc ngày này</div>';
      return;
    }

    var html = '<div class="tline">';
    for (var i = 0; i < arr.length; i++) {
      var t = arr[i];
      html += '<div class="titem">';
      html += '<div class="ttime">' + (t.time || '--') + '</div>';
      html += '<div class="tdot' + (t.done ? ' done' : '') + '"></div>';
      html += '<div class="tcard' + (t.done ? ' done' : '') + '" onclick="window._toggle(' + t.id + ')">';
      html += '<div class="tc-t">' + esc(t.text) + '</div>';
      html += '<div class="tc-m"><span class="pbadge ' + priCls(t.pri)
